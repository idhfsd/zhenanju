# Netlify 部署配置
# 仓库根目录有这个文件，Netlify 连上仓库后会自动按下面的命令构建。
[build]
  # 前端在 zhenanju-vue 子目录里，先进去再装依赖、构建
  command = "cd zhenanju-vue && npm ci && npm run build"
  publish = "zhenanju-vue/dist"

# 如果 Netlify 后台把 Base directory 设成了 zhenanju-vue，
# 上面两行就要相应改成 command = "npm ci && npm run build"、publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# 前端用的是 hash 路由（/#/monitor），正常不需要这条；
# 留着是为了以后切成 history 模式时页面刷新不 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
